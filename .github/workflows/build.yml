name: Build Gershwin WindowManager

# Build gershwin-windowmanager against the real Gershwin stack by reusing
# gershwin-developer: build the core libraries once ("make corelibs"), then
# build the checkout under test ("make windowmanager"). The sources are provided by
# this repo's checkout via a symlink, and SKIP_REPOS keeps Checkout.sh from
# cloning this repo or the sibling apps that are not needed to build corelibs.
#
# Only the FreeBSD build is kept: this repo is NextBSD's XLibre.app, and the
# Arch, Debian and OpenBSD builds tested nothing NextBSD ships. Xnextbsd has
# its own workflow (xnextbsd.yml).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  SKIP_REPOS: >-
    gershwin-workspace
    gershwin-systempreferences
    gershwin-eau-theme
    gershwin-terminal
    gershwin-textedit
    gershwin-windowmanager

jobs:
  build-freebsd-14-amd64:
    name: FreeBSD x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: gershwin-windowmanager

      - name: Build windowmanager inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          sync: rsync
          copyback: false
          cpu: 2
          mem: 4096
          prepare: |
            pkg update
            pkg install -y git
          run: |
            set -e
            BASE="$(pwd)"
            git clone --depth 1 https://github.com/gershwin-desktop/gershwin-developer.git
            cd "$BASE/gershwin-developer"
            ./Library/Scripts/bootstrap.sh
            SKIP_REPOS="${{ env.SKIP_REPOS }}" ./Library/Scripts/checkout.sh
            ln -sfn "$BASE/gershwin-windowmanager" Library/Sources/gershwin-windowmanager
            make corelibs
            make windowmanager
